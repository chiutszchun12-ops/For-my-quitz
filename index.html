<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>( ´∀｀ )規約インストラクター試験対策</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.header{
    background:#222;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h1,h2{
    text-align:center;
}

.menu-btn,
.answer-btn,
.next-btn{

    width:100%;
    padding:15px;
    margin-top:10px;

    border:none;
    border-radius:8px;

    color:white;
    font-size:18px;
    cursor:pointer;
}

.menu-btn{
    background:#3f7f2c;
}

.answer-btn{
    background:#0066cc;
}

.next-btn{
    background:#3f7f2c;
}

.option{

    display:block;

    margin:10px 0;
    padding:15px;

    border:2px solid #ddd;
    border-radius:8px;

    cursor:pointer;
}

.option:hover{
    background:#eef6ff;
}

#question{
    font-size:22px;
    margin-bottom:20px;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.correct{
    color:green;
}

.wrong{
    color:red;
}

@media(max-width:768px){

    #question{
        font-size:18px;
    }

    .menu-btn,
    .answer-btn,
    .next-btn{
        font-size:16px;
    }

}

</style>

</head>
<body>

<div class="header">

<div>
規約インストラクター試験
</div>

<div id="timer">
残り時間 30:00
</div>

</div>

<div class="container">

<div id="home" class="card">

<h1>規約インストラクター試験対策</h1>

<button class="menu-btn" onclick="startQuiz(10)">
10問チャレンジ（通勤時）
</button>

<button class="menu-btn" onclick="startQuiz(20)">
20問チャレンジ（ランチやディナー）
</button>

<button class="menu-btn" onclick="startQuiz(30)">
30問チャレンジ（勉強したいとき）
</button>

<button class="menu-btn" onclick="startRandomQuiz()">
ランダム25問（能力テスト）
</button>

</div>

<div id="quiz" class="card" style="display:none;">

<div id="questionInfo"></div>

<br>

<div id="question"></div>

<div id="choices"></div>

<button class="answer-btn"
onclick="checkAnswer()">

回答する

</button>

<div id="result"></div>

<button
id="nextBtn"
class="next-btn"
style="display:none;"
onclick="nextQuestion()">

次の問題

</button>

</div>

</div>

<script>

const allQuestions = [

{
  question:"医療機器業界の4つの自主ルールのうち、法的根拠を有するものはどれか？",
  choices:[
    "倫理綱領",
    "企業行動憲章",
    "医療機器業プロモーションコード",
    "医療機器業公正競争規約"
  ],
  answer:"医療機器業公正競争規約",
  explanation:"景品表示法に基づいて認定された自主規制ルールである。"
},
{
  question:"医療機器業公正競争規約の管理運営組織はどれか？",
  choices:[
    "日本医療機器産業連合会",
    "消費者庁",
    "医療機器業公正取引協議会",
    "厚生労働省"
  ],
  answer:"医療機器業公正取引協議会",
  explanation:"医療機器業公正競争規約の運営主体である。"
},
{
  question:"景品表示法を制定・改正する機関はどれか？",
  choices:[
    "消費者庁",
    "公正取引委員会",
    "国会",
    "内閣府"
  ],
  answer:"国会",
  explanation:"法律の制定・改正を行うのは国会である。"
},
{
  question:"景品表示法に基づく告示を制定するのは誰か？",
  choices:[
    "厚生労働大臣",
    "消費者庁長官",
    "公正取引委員会委員長",
    "内閣総理大臣"
  ],
  answer:"内閣総理大臣",
  explanation:"告示の制定権限は内閣総理大臣にある。"
},
{
  question:"医療機器業公正競争規約が施行されたのはいつか？",
  choices:[
    "平成9年8月",
    "平成10年11月",
    "平成11年4月",
    "平成17年4月"
  ],
  answer:"平成11年4月",
  explanation:"平成10年11月認定、平成11年4月施行。"
},
{
  question:"医療機器業公正競争規約の目的で正しいものはどれか？",
  choices:[
    "売上向上",
    "市場独占",
    "不当な顧客誘引の防止",
    "利益最大化"
  ],
  answer:"不当な顧客誘引の防止",
  explanation:"公正な競争と適正な取引の確保が目的である。"
},
{
  question:"景品類に該当するものはどれか？",
  choices:[
    "商品券",
    "旅行招待",
    "金銭",
    "上記すべて"
  ],
  answer:"上記すべて",
  explanation:"経済上の利益に該当するため景品類となる。"
},
{
  question:"景品類に該当しないものはどれか？",
  choices:[
    "商品券",
    "旅行招待",
    "アフターサービス",
    "金券"
  ],
  answer:"アフターサービス",
  explanation:"通常の商慣習として認められるサービスである。"
},
{
  question:"大学への奨学寄付金で必要要件ではないものはどれか？",
  choices:[
    "大学規程による受入",
    "研究目的指定",
    "研究結果報告",
    "製品採用約束"
  ],
  answer:"製品採用約束",
  explanation:"寄付と採用を結びつけることは禁止されている。"
},
{
  question:"参加者の飲食代を寄付金で補填する行為はどう扱われるか？",
  choices:[
    "問題ない",
    "条件付きで可能",
    "規約違反",
    "学会なら可能"
  ],
  answer:"規約違反",
  explanation:"個人への経済的利益供与に該当する。"
},
{
  question:"デモ目的での医療機器貸出期間の上限は？",
  choices:[
    "2週間",
    "1か月",
    "3か月",
    "6か月"
  ],
  answer:"1か月",
  explanation:"デモ目的貸与は1か月以内。"
},
{
  question:"試用目的での医療機器貸出期間の上限は？",
  choices:[
    "1か月",
    "3か月",
    "6か月",
    "12か月"
  ],
  answer:"6か月",
  explanation:"試用目的貸与は6か月以内。"
},
{
  question:"研究目的での医療機器貸出期間の上限は？",
  choices:[
    "6か月",
    "12か月",
    "18か月",
    "24か月"
  ],
  answer:"12か月",
  explanation:"研究貸出しは12か月以内。"
},
{
  question:"貸出し確認書の保存期間は？",
  choices:[
    "1年",
    "3年",
    "5年",
    "10年"
  ],
  answer:"5年",
  explanation:"貸出し確認書は5年間保存する。"
},
{
  question:"立会い実施確認書の保存期間は？",
  choices:[
    "1年",
    "3年",
    "5年",
    "10年"
  ],
  answer:"5年",
  explanation:"立会い実施確認書は5年間保存する。"
},
{
  question:"適正使用確保のための立会い回数上限は？",
  choices:[
    "2回",
    "3回",
    "4回",
    "5回"
  ],
  answer:"4回",
  explanation:"原則として4回までと定められている。"
},
{
  question:"新規納入品に対する立会い期間の上限は？",
  choices:[
    "1か月",
    "2か月",
    "4か月",
    "12か月"
  ],
  answer:"4か月",
  explanation:"新規納入等の場合は4か月以内。"
},
{
  question:"規約上、寄付が認められるものはどれか？",
  choices:[
    "医師個人への寄付",
    "病院経営資金補填",
    "災害復旧支援",
    "採用見返り寄付"
  ],
  answer:"災害復旧支援",
  explanation:"公益性が高く見返りを求めない支援は認められる。"
},
{
  question:"医療機器業公正競争規約の対象となるのは誰か？",
  choices:[
    "事業者",
    "医療従事者",
    "患者",
    "行政"
  ],
  answer:"事業者",
  explanation:"規約は事業者の販売促進活動等を規制する。"
},
{
  question:"景品類提供による問題として最も適切なものは？",
  choices:[
    "適正使用推進",
    "公正競争の促進",
    "不当な顧客誘引",
    "品質向上"
  ],
  answer:"不当な顧客誘引",
  explanation:"規約は不当な顧客誘引を防止するために存在する。"
},

];

let questions=[];
let currentQuestion=0;
let score=0;

let timeLeft=1800;
let timerId;

function startTimer(){

clearInterval(timerId);

timeLeft=1800;

timerId=setInterval(()=>{

timeLeft--;

let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

document.getElementById("timer").innerText=
`残り時間 ${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

if(timeLeft<=0){

clearInterval(timerId);

alert("試験終了");

finishQuiz();

}

},1000);

}

function shuffle(array){

return [...array]
.sort(()=>Math.random()-0.5);

}

function startQuiz(count){

currentQuestion=0;
score=0;

questions=[];

for(let i=0;i<count;i++){

questions.push(
allQuestions[
i % allQuestions.length
]
);

}

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function startRandomQuiz(){

currentQuestion=0;
score=0;

questions=
shuffle(allQuestions).slice(0,25);

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function showQuestion(){

const q=questions[currentQuestion];

document.getElementById("questionInfo").innerHTML=

`問題 ${currentQuestion+1}
 / ${questions.length}`;

document.getElementById("question").innerHTML=
q.question;

document.getElementById("choices").innerHTML=

q.choices.map(choice=>

`
<label class="option">
<input type="radio"
name="answer"
value="${choice}">
${choice}
</label>
`

).join("");

document.getElementById("result").innerHTML="";

document.getElementById("nextBtn")
.style.display="none";

}

function checkAnswer(){

const selected=

document.querySelector(
'input[name="answer"]:checked'
);

if(!selected){

alert("選択してください");

return;

}

const q=questions[currentQuestion];

if(selected.value===q.answer){

score++;

document.getElementById("result").innerHTML=
'<span class="correct">〇 正解</span>';

}else{

document.getElementById("result").innerHTML=

`<span class="wrong">

✕ 不正解

<br><br>

正解：
${q.answer}

</span>`;

}

document.getElementById("nextBtn")
.style.display="block";

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion>=questions.length){

finishQuiz();

return;

}

showQuestion();

}

function finishQuiz(){

clearInterval(timerId);

const rate=Math.round(
score/questions.length*100
);

document.getElementById("quiz").innerHTML=

`

<h1>試験終了</h1>

<br>

<h2>正答数</h2>

<h1>
${score} / ${questions.length}
</h1>

<br>

<h2>正答率</h2>

<h1>
${rate}%
</h1>

<button
class="menu-btn"
onclick="location.reload()">

HOMEへ戻る

</button>

`;

}

</script>

</body>
</html>
