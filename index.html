<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>( ´∀｀ )規約インストラクター試験対策</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.header{
    background:#222;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h1,h2{
    text-align:center;
}

.menu-btn,
.answer-btn,
.next-btn{

    width:100%;
    padding:15px;
    margin-top:10px;

    border:none;
    border-radius:8px;

    color:white;
    font-size:18px;
    cursor:pointer;
}

.menu-btn{
    background:#3f7f2c;
}

.answer-btn{
    background:#0066cc;
}

.next-btn{
    background:#3f7f2c;
}

.option{

    display:block;

    margin:10px 0;
    padding:15px;

    border:2px solid #ddd;
    border-radius:8px;

    cursor:pointer;
}

.option:hover{
    background:#eef6ff;
}

#question{
    font-size:22px;
    margin-bottom:20px;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.correct{
    color:green;
}

.wrong{
    color:red;
}

@media(max-width:768px){

    #question{
        font-size:18px;
    }

    .menu-btn,
    .answer-btn,
    .next-btn{
        font-size:16px;
    }

}

</style>

</head>
<body>

<div class="header">

<div>
規約インストラクター試験
</div>

<div id="timer">
残り時間 30:00
</div>

</div>

<div class="container">

<div id="home" class="card">

<h1>趙専用規約インストラクター試験対策</h1>

<button class="menu-btn" onclick="startQuiz(10)">
10問チャレンジ（通勤時）
</button>

<button class="menu-btn" onclick="startQuiz(20)">
20問チャレンジ（ランチやディナー）
</button>

<button class="menu-btn" onclick="startRandomQuiz(10)">
ランダム10問（能力テスト）
</button>

</div>

<div id="quiz" class="card" style="display:none;">

<div id="questionInfo"></div>

<br>

<div id="question"></div>

<div id="choices"></div>

<button class="answer-btn"
onclick="checkAnswer()">

回答する

</button>

<div id="result"></div>

<button
id="nextBtn"
class="next-btn"
style="display:none;"
onclick="nextQuestion()">

次の問題

</button>

</div>

</div>

<script>

const allQuestions = [

{
  id:"C101",
  question:"優良誤認表示とは何か。",
  choices:[
    "実際より著しく優良であると誤認させる表示",
    "価格を表示する行為",
    "添付文書を配布する行為",
    "学会で発表する行為"
  ],
  answer:"実際より著しく優良であると誤認させる表示",
  explanation:"優良誤認表示は、商品やサービスが実際より著しく優良であると誤認させる表示をいう。"
},
{
  id:"C102",
  question:"有利誤認表示とは何か。",
  choices:[
    "実際より有利な条件であると誤認させる表示",
    "性能を説明する表示",
    "添付文書の記載",
    "製品名の表示"
  ],
  answer:"実際より有利な条件であると誤認させる表示",
  explanation:"価格や取引条件について実際より有利であると誤認させる表示である。"
},
{
  id:"C103",
  question:"医療機器業プロモーションコードの目的は？",
  choices:[
    "適正な情報提供活動の推進",
    "シェア拡大",
    "販売価格統制",
    "輸出促進"
  ],
  answer:"適正な情報提供活動の推進",
  explanation:"医療機器業プロモーションコードは適正な情報提供活動を推進するための基準である。"
},
{
  id:"C104",
  question:"医療機器業倫理綱領の目的は？",
  choices:[
    "企業倫理の遵守",
    "販売拡大",
    "価格交渉",
    "市場支配"
  ],
  answer:"企業倫理の遵守",
  explanation:"倫理綱領は企業活動における高い倫理観の維持を求めている。"
},
{
  id:"C105",
  question:"企業行動憲章が求めるものは？",
  choices:[
    "社会的責任を果たす行動",
    "競争排除",
    "販売目標達成",
    "価格優位性"
  ],
  answer:"社会的責任を果たす行動",
  explanation:"企業は社会の一員として責任ある行動が求められる。"
},
{
  id:"C106",
  question:"立会いの本来の目的はどれか。",
  choices:[
    "適正使用支援",
    "売上向上",
    "症例獲得",
    "採用促進"
  ],
  answer:"適正使用支援",
  explanation:"立会いは医療機器の適正使用支援のために行われる。"
},
{
  id:"C107",
  question:"営業担当者が実施できない行為はどれか。",
  choices:[
    "医療行為",
    "資料配布",
    "製品説明",
    "注意喚起"
  ],
  answer:"医療行為",
  explanation:"営業担当者は医療従事者の代わりに医療行為を行ってはならない。"
},
{
  id:"C108",
  question:"寄付の実施において必要な要件はどれか。",
  choices:[
    "公益性",
    "採用品目",
    "売上目標",
    "市場占有率"
  ],
  answer:"公益性",
  explanation:"寄付は公益的または学術的目的を有している必要がある。"
},
{
  id:"C109",
  question:"貸出し管理で重要なものはどれか。",
  choices:[
    "貸出目的の明確化",
    "売上予測",
    "競合分析",
    "市場価格"
  ],
  answer:"貸出目的の明確化",
  explanation:"貸出しは目的・期間・管理方法を明確にして実施する。"
},
{
  id:"C110",
  question:"飲食提供ルールで最も重視される考え方はどれか。",
  choices:[
    "社会通念上妥当であること",
    "高級店であること",
    "参加人数が多いこと",
    "営業利益が高いこと"
  ],
  answer:"社会通念上妥当であること",
  explanation:"飲食提供は社会通念上妥当な範囲でなければならない。"
},
    

];

let questions=[];
let currentQuestion=0;
let score=0;

let timeLeft=1800;
let timerId;

function startTimer(){

clearInterval(timerId);

timeLeft=1800;

timerId=setInterval(()=>{

timeLeft--;

let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

document.getElementById("timer").innerText=
`残り時間 ${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

if(timeLeft<=0){

clearInterval(timerId);

alert("試験終了");

finishQuiz();

}

},1000);

}

function shuffle(array){

return [...array]
.sort(()=>Math.random()-0.5);

}

function startQuiz(count){

currentQuestion=0;
score=0;

questions=[];

for(let i=0;i<count;i++){

questions.push(
allQuestions[
i % allQuestions.length
]
);

}

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function startRandomQuiz(){

currentQuestion=0;
score=0;

questions=
shuffle(allQuestions).slice(0,25);

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function showQuestion(){

const q=questions[currentQuestion];

document.getElementById("questionInfo").innerHTML=

`問題 ${currentQuestion+1}
 / ${questions.length}`;

document.getElementById("question").innerHTML=
q.question;

document.getElementById("choices").innerHTML=

q.choices.map(choice=>

`
<label class="option">
<input type="radio"
name="answer"
value="${choice}">
${choice}
</label>
`

).join("");

document.getElementById("result").innerHTML="";

document.getElementById("nextBtn")
.style.display="none";

}

function checkAnswer(){

const selected=

document.querySelector(
'input[name="answer"]:checked'
);

if(!selected){

alert("選択してください");

return;

}

const q=questions[currentQuestion];

if(selected.value===q.answer){

    score++;

    document.getElementById("result").innerHTML=
    `
    <span class="correct">
    ○ 正解
    <br><br>
    ${q.explanation}
    </span>
    `;

}else{

document.getElementById("result").innerHTML=

`<span class="wrong">

✕ 不正解

<br><br>

正解：
${q.answer}

<br><br>

${q.explanation}


</span>`;

}

document.getElementById("nextBtn")
.style.display="block";

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion>=questions.length){

finishQuiz();

return;

}

showQuestion();

}

function finishQuiz(){

clearInterval(timerId);

const rate=Math.round(
score/questions.length*100
);

document.getElementById("quiz").innerHTML=

`

<h1>試験終了</h1>

<br>

<h2>正答数</h2>

<h1>
${score} / ${questions.length}
</h1>

<br>

<h2>正答率</h2>

<h1>
${rate}%
</h1>

<button
class="menu-btn"
onclick="location.reload()">

HOMEへ戻る

</button>

`;

}

</script>

</body>
</html>
