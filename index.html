<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>( ´∀｀ )規約インストラクター試験対策</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

.header{
    background:#222;
    color:white;
    padding:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

h1,h2{
    text-align:center;
}

.menu-btn,
.answer-btn,
.next-btn{

    width:100%;
    padding:15px;
    margin-top:10px;

    border:none;
    border-radius:8px;

    color:white;
    font-size:18px;
    cursor:pointer;
}

.menu-btn{
    background:#3f7f2c;
}

.answer-btn{
    background:#0066cc;
}

.next-btn{
    background:#3f7f2c;
}

.option{

    display:block;

    margin:10px 0;
    padding:15px;

    border:2px solid #ddd;
    border-radius:8px;

    cursor:pointer;
}

.option:hover{
    background:#eef6ff;
}

#question{
    font-size:22px;
    margin-bottom:20px;
}

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

.correct{
    color:green;
}

.wrong{
    color:red;
}

@media(max-width:768px){

    #question{
        font-size:18px;
    }

    .menu-btn,
    .answer-btn,
    .next-btn{
        font-size:16px;
    }

}

</style>

</head>
<body>

<div class="header">

<div>
規約インストラクター試験
</div>

<div id="timer">
残り時間 30:00
</div>

</div>

<div class="container">

<div id="home" class="card">

<h1>規約インストラクター試験対策</h1>

<button class="menu-btn" onclick="startQuiz(10)">
10問チャレンジ
</button>

<button class="menu-btn" onclick="startQuiz(20)">
20問チャレンジ
</button>

<button class="menu-btn" onclick="startQuiz(30)">
30問チャレンジ
</button>

<button class="menu-btn" onclick="startRandomQuiz()">
ランダム25問
</button>

</div>

<div id="quiz" class="card" style="display:none;">

<div id="questionInfo"></div>

<br>

<div id="question"></div>

<div id="choices"></div>

<button class="answer-btn"
onclick="checkAnswer()">

回答する

</button>

<div id="result"></div>

<button
id="nextBtn"
class="next-btn"
style="display:none;"
onclick="nextQuestion()">

次の問題

</button>

</div>

</div>

<script>

const allQuestions = [

{
question:"規約違反となる行為は？",
choices:[
"受講記録保管",
"資格貸与",
"適切説明",
"文書管理"
],
answer:"資格貸与"
},

{
question:"インストラクターの義務は？",
choices:[
"適切な説明",
"無断欠席",
"情報漏洩",
"資格譲渡"
],
answer:"適切な説明"
},

{
question:"個人情報の取扱いとして正しいものは？",
choices:[
"公開する",
"販売する",
"保護する",
"放置する"
],
answer:"保護する"
},

{
question:"受講記録はどうする？",
choices:[
"保管する",
"捨てる",
"改ざんする",
"隠す"
],
answer:"保管する"
}

];

let questions=[];
let currentQuestion=0;
let score=0;

let timeLeft=1800;
let timerId;

function startTimer(){

clearInterval(timerId);

timeLeft=1800;

timerId=setInterval(()=>{

timeLeft--;

let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

document.getElementById("timer").innerText=
`残り時間 ${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

if(timeLeft<=0){

clearInterval(timerId);

alert("試験終了");

finishQuiz();

}

},1000);

}

function shuffle(array){

return [...array]
.sort(()=>Math.random()-0.5);

}

function startQuiz(count){

currentQuestion=0;
score=0;

questions=[];

for(let i=0;i<count;i++){

questions.push(
allQuestions[
i % allQuestions.length
]
);

}

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function startRandomQuiz(){

currentQuestion=0;
score=0;

questions=
shuffle(allQuestions).slice(0,25);

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function showQuestion(){

const q=questions[currentQuestion];

document.getElementById("questionInfo").innerHTML=

`問題 ${currentQuestion+1}
 / ${questions.length}`;

document.getElementById("question").innerHTML=
q.question;

document.getElementById("choices").innerHTML=

q.choices.map(choice=>

`
<label class="option">
<input type="radio"
name="answer"
value="${choice}">
${choice}
</label>
`

).join("");

document.getElementById("result").innerHTML="";

document.getElementById("nextBtn")
.style.display="none";

}

function checkAnswer(){

const selected=

document.querySelector(
'input[name="answer"]:checked'
);

if(!selected){

alert("選択してください");

return;

}

const q=questions[currentQuestion];

if(selected.value===q.answer){

score++;

document.getElementById("result").innerHTML=
'<span class="correct">〇 正解</span>';

}else{

document.getElementById("result").innerHTML=

`<span class="wrong">

✕ 不正解

<br><br>

正解：
${q.answer}

</span>`;

}

document.getElementById("nextBtn")
.style.display="block";

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion>=questions.length){

finishQuiz();

return;

}

showQuestion();

}

function finishQuiz(){

clearInterval(timerId);

const rate=Math.round(
score/questions.length*100
);

document.getElementById("quiz").innerHTML=

`

<h1>試験終了</h1>

<br>

<h2>正答数</h2>

<h1>
${score} / ${questions.length}
</h1>

<br>

<h2>正答率</h2>

<h1>
${rate}%
</h1>

<button
class="menu-btn"
onclick="location.reload()">

HOMEへ戻る

</button>

`;

}

</script>

</body>
</html>
