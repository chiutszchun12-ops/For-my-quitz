<title>規約インストラクター試験</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;

    font-family:Arial,sans-serif;
    background:#ececec;

}

.header{
    background:black;
    color:white;
    padding:10px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.exam-info{
    display:flex;
    gap:40px;
}

.main{
    display:flex;
    height:calc(100vh - 60px);
}

.sidebar{
    width:80px;
    background:#f5f5f5;
    border-right:1px solid #ccc;
    padding:10px;
}

.question-number{
    background:#7aa63d;
    color:white;
    text-align:center;
    padding:10px;
    margin-bottom:10px;
    cursor:pointer;
    border-radius:5px;
}

.question-number.active{
    background:#4b7900;
}

.content{
    flex:1;
    padding:20px;
}

.question-box{
    background:white;
    border:1px solid #ccc;
    border-radius:5px;
    padding:20px;
    min-height:120px;
}

.question-title{
    font-size:20px;
    margin-bottom:20px;
}

.option{
    border:2px solid #607d8b;
    background:white;
    padding:15px;
    margin-top:15px;
    cursor:pointer;
    border-radius:4px;
}
