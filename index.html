let questions=[];
let currentQuestion=0;
let score=0;

let timeLeft=1800;
let timerId;

function startTimer(){

clearInterval(timerId);

timeLeft=1800;

timerId=setInterval(()=>{

timeLeft--;

let min=Math.floor(timeLeft/60);
let sec=timeLeft%60;

document.getElementById("timer").innerText=
`残り時間 ${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

if(timeLeft<=0){

clearInterval(timerId);

alert("試験終了");

finishQuiz();

}

},1000);

}

function shuffle(array){

return [...array]
.sort(()=>Math.random()-0.5);

}

function startQuiz(count){

currentQuestion=0;
score=0;

questions=[];

for(let i=0;i<count;i++){

questions.push(
allQuestions[
i % allQuestions.length
]
);

}

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function startRandomQuiz(){

currentQuestion=0;
score=0;

questions=
shuffle(allQuestions).slice(0,25);

document.getElementById("home").style.display="none";
document.getElementById("quiz").style.display="block";

startTimer();

showQuestion();

}

function showQuestion(){

const q=questions[currentQuestion];

document.getElementById("questionInfo").innerHTML=

`問題 ${currentQuestion+1}
 / ${questions.length}`;

document.getElementById("question").innerHTML=
q.question;

document.getElementById("choices").innerHTML=

q.choices.map(choice=>

`
<label class="option">
<input type="radio"
name="answer"
value="${choice}">
${choice}
</label>
`

).join("");

document.getElementById("result").innerHTML="";

document.getElementById("nextBtn")
.style.display="none";

}

function checkAnswer(){

const selected=

document.querySelector(
'input[name="answer"]:checked'
);

if(!selected){

alert("選択してください");

return;

}

const q=questions[currentQuestion];

if(selected.value===q.answer){

    score++;

    document.getElementById("result").innerHTML=
    `
    <span class="correct">
    ○ 正解
    <br><br>
    ${q.explanation}
    </span>
    `;

}else{

document.getElementById("result").innerHTML=

`<span class="wrong">

✕ 不正解

<br><br>

正解：
${q.answer}

<br><br>

${q.explanation}


</span>`;

}

document.getElementById("nextBtn")
.style.display="block";

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion>=questions.length){

finishQuiz();

return;

}

showQuestion();

}

function finishQuiz(){

clearInterval(timerId);

const rate=Math.round(
score/questions.length*100
);

document.getElementById("quiz").innerHTML=

`

<h1>試験終了</h1>

<br>

<h2>正答数</h2>

<h1>
${score} / ${questions.length}
</h1>

<br>

<h2>正答率</h2>

<h1>
${rate}%
</h1>

<button
class="menu-btn"
onclick="location.reload()">

HOMEへ戻る

</button>

`;

}

</script>
